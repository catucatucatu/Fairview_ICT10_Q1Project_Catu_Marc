    <div style="background-color: lightblue; margin: 50px; padding: 20px; border: lightpink 2px solid; border-radius: 15px; font-family: Poppins;">

        <h2>SKU Generator</h2>
        <label for="category"><b>Category:</b></label>

            <option>New</option>
            <option>Cup</option>
            <option>Cone</option>

        <br><br>
        <label for="product"><b>Product:</b></label><br>

        <input type="number" id="quantity" placeholder="Example: 50"><br><br>
        <input type="button" py-click="sku" value="Submit" style="color: floralwhite; background-color: lightpink; font-size: 15px;">
    </form>
    <br>
